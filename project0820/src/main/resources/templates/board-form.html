<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.id == null} ? '새 글 작성' : '글 수정'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${board.id == null} ? '새 글 작성' : '글 수정'"></h1>
    <form action="/boards/save" th:object="${board}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label for="author" class="form-label">작성자</label>
            <input type="text" id="author" class="form-control" th:field="*{author}" required>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" id="title" class="form-control" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea id="content" class="form-control" rows="10" th:field="*{content}" required></textarea>
        </div>
        <div class="d-flex justify-content-end">
            <a href="/boards" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary" th:text="${board.id == null} ? '저장' : '수정'"></button>
        </div>
    </form>
</div>
</body>
</html>
