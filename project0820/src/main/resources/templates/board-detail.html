<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2 th:text="${board.title}"></h2>
            <small class="text-muted" th:text="'작성자: ' + ${board.author}"></small>
        </div>
        <div class="card-body">
            <p style="white-space: pre-wrap;" th:text="${board.content}"></p>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a href="/boards" class="btn btn-secondary">목록</a>
            <div>
                <a th:href="@{/boards/{id}/edit(id=${board.id})}" class="btn btn-warning">수정</a>
                <form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('삭제하시겠습니까?');">삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
